  <path d="M55 54 Q62 50 69 54" stroke="#2B2620" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="28" cy="75" rx="6" ry="3.6" fill="#FF9F9F" opacity="0.55"/>
