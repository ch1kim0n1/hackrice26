  <ellipse cx="62" cy="22" rx="14" ry="7" fill="#b85f00" transform="rotate(-28 62 22)"/>
  <!-- peel texture -->
  <circle cx="30" cy="45" r="1.6" fill="#b85f00" opacity="0.35"/>
  <circle cx="70" cy="48" r="1.6" fill="#b85f00" opacity="0.35"/>
