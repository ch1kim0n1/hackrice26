<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3A342E; }
    a:hover { color: #6FCF97; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:{{tone.accentBg}};font-family:'Quicksand', ui-rounded, system-ui, sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <div style="position:absolute;top:-60px;right:-60px;width:170px;height:170px;border-radius:50%;background:{{tone.accentSoft}};opacity:0.6;"></div>

  <!-- top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 20px 0;position:relative;z-index:2;">
    <div style="width:34px;height:34px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(58,52,46,0.05), 0 6px 16px -9px rgba(58,52,46,0.16);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#3A342E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span style="font-family:'Baloo 2', ui-rounded, system-ui;font-weight:800;font-size:17px;color:#3A342E;">Nutrition Stats</span>
    <div style="width:34px;height:34px;"></div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px 20px;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;">

    <!-- streak card -->
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(58,52,46,0.05), 0 6px 16px -9px rgba(58,52,46,0.16);">
      <div style="width:52px;height:52px;border-radius:16px;background:{{tone.accentSoft}};display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4-4 5-4 9a4 4 0 008 0c0-2-1-3-1-3s2 1 2 4a5 5 0 01-10 0c0-5 5-6 5-10z" fill="#FF9F5A"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-family:'Baloo 2', ui-rounded, system-ui;font-weight:800;font-size:19px;color:#3A342E;">7 day streak</div>
        <div style="font-size:11.5px;font-weight:600;color:#8A857C;">Personal best: 12 days</div>
      </div>
    </div>

    <!-- weekly overview -->
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(58,52,46,0.05), 0 6px 16px -9px rgba(58,52,46,0.16);">
      <div style="font-family:'Baloo 2', ui-rounded, system-ui;font-weight:700;font-size:14.5px;color:#3A342E;margin-bottom:12px;">This Week's Boost</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;height:90px;gap:6px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:55%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">M</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:70%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">T</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:40%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">W</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:85%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">T</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:64%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">F</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accentSoft}};height:30%;"></div>
          <span style="font-size:9.5px;font-weight:700;color:#B9B4AC;">S</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;">
          <div style="width:100%;border-radius:6px;background:{{tone.accent}};height:95%;box-shadow:0 0 12px -2px {{tone.accent}};"></div>
          <span style="font-size:9.5px;font-weight:800;color:{{tone.accentDark}};">S</span>
        </div>
      </div>
    </div>

    <!-- nutrient breakdown -->
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(58,52,46,0.05), 0 6px 16px -9px rgba(58,52,46,0.16);">
      <div style="font-family:'Baloo 2', ui-rounded, system-ui;font-weight:700;font-size:14.5px;color:#3A342E;margin-bottom:12px;">Today's Nutrients</div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="{{tone.accent}}"/></svg>
          <span style="font-size:12px;font-weight:600;color:#5B564E;width:82px;">Protein</span>
          <div style="flex:1;height:8px;border-radius:6px;background:#F0EEEA;overflow:hidden;"><div style="width:82%;height:100%;background:{{tone.accent}};"></div></div>
          <span style="font-size:11.5px;font-weight:800;color:#3A342E;width:30px;text-align:right;">82%</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4C15 5 16 9 13 12 C10 15 6 13 6 9 C6 6 8 4.5 12 4Z" fill="#7DBB8B"/></svg>
          <span style="font-size:12px;font-weight:600;color:#5B564E;width:82px;">Fiber</span>
          <div style="flex:1;height:8px;border-radius:6px;background:#F0EEEA;overflow:hidden;"><div style="width:61%;height:100%;background:{{tone.accent}};"></div></div>
          <span style="font-size:11.5px;font-weight:800;color:#3A342E;width:30px;text-align:right;">61%</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.4L19 9.2l-5.2 1.8L12 16.4l-1.8-5.4L5 9.2l5.2-1.8L12 2z" fill="#FFC24B"/></svg>
          <span style="font-size:12px;font-weight:600;color:#5B564E;width:82px;">Fruit/Veg</span>
          <div style="flex:1;height:8px;border-radius:6px;background:#F0EEEA;overflow:hidden;"><div style="width:90%;height:100%;background:{{tone.accent}};"></div></div>
          <span style="font-size:11.5px;font-weight:800;color:#3A342E;width:30px;text-align:right;">90%</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z" fill="#56B8F5"/></svg>
          <span style="font-size:12px;font-weight:600;color:#5B564E;width:82px;">Hydration</span>
          <div style="flex:1;height:8px;border-radius:6px;background:#F0EEEA;overflow:hidden;"><div style="width:48%;height:100%;background:{{tone.accent}};"></div></div>
          <span style="font-size:11.5px;font-weight:800;color:#3A342E;width:30px;text-align:right;">48%</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#B892FF" stroke-width="2"/></svg>
          <span style="font-size:12px;font-weight:600;color:#5B564E;width:82px;">Micronutrients</span>
          <div style="flex:1;height:8px;border-radius:6px;background:#F0EEEA;overflow:hidden;"><div style="width:70%;height:100%;background:{{tone.accent}};"></div></div>
          <span style="font-size:11.5px;font-weight:800;color:#3A342E;width:30px;text-align:right;">70%</span>
        </div>
      </div>
    </div>

    <!-- calorie range -->
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(58,52,46,0.05), 0 6px 16px -9px rgba(58,52,46,0.16);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-family:'Baloo 2', ui-rounded, system-ui;font-weight:700;font-size:14.5px;color:#3A342E;">Calorie Range</span>
        <span style="font-size:11px;font-weight:700;color:{{tone.accentDark}};background:{{tone.accentSoft}};padding:4px 10px;border-radius:12px;">On target 5/7 days</span>
      </div>
      <div style="position:relative;height:10px;border-radius:6px;background:#F0EEEA;">
        <div style="position:absolute;left:22%;right:30%;top:0;bottom:0;border-radius:6px;background:{{tone.accentSoft}};"></div>
        <div style="position:absolute;left:46%;top:-4px;width:4px;height:18px;border-radius:2px;background:{{tone.accent}};"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;">
        <span style="font-size:10px;font-weight:600;color:#B9B4AC;">1,600</span>
        <span style="font-size:10px;font-weight:600;color:#B9B4AC;">2,400</span>
      </div>
    </div>

    <div style="text-align:center;font-size:10.5px;font-weight:600;color:#B9B4AC;padding:2px 10px 6px;">Stats reset daily at midnight · squad multiplier uses your last 24 hours</div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "accentColor": {"editor":"color","default":"#5FCB82","options":["#5FCB82","#56B8F5","#F78FB3","#FFB86B","#B892FF","#8FE3A0"]},
  "colorMode": {"editor":"enum","default":"active","options":["active","best-unselected","none"]}
}'>
function hexToHsl(hex) {
  hex = hex.replace('#', '');
  var r = parseInt(hex.substring(0,2),16)/255;
  var g = parseInt(hex.substring(2,4),16)/255;
  var b = parseInt(hex.substring(4,6),16)/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var h, s, l = (max+min)/2;
  if (max === min) { h = 0; s = 0; }
  else {
    var d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if (max === r) h = (g-b)/d + (g < b ? 6 : 0);
    else if (max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h /= 6;
  }
  return { h: h*360, s: s*100, l: l*100 };
}
function hslStr(h,s,l) { return 'hsl(' + h.toFixed(1) + ', ' + s.toFixed(1) + '%, ' + l.toFixed(1) + '%)'; }
function getTone(accentColor, colorMode) {
  if (colorMode === 'none') {
    return { accent: '#9C978F', accentDark: '#6B665F', accentSoft: '#ECEAE6', accentBg: '#FAFAF8' };
  }
  var hsl = hexToHsl(accentColor);
  var sat = Math.max(hsl.s, 45);
  return {
    accent: hslStr(hsl.h, sat, 58),
    accentDark: hslStr(hsl.h, sat, 36),
    accentSoft: hslStr(hsl.h, Math.min(sat,55), 90),
    accentBg: hslStr(hsl.h, Math.min(sat,40), 97)
  };
}
class Component extends DCLogic {
  renderVals() {
    var accentColor = this.props.accentColor || '#5FCB82';
    var colorMode = this.props.colorMode || 'active';
    return { tone: getTone(accentColor, colorMode) };
  }
}
</script>
</body>
</html>
