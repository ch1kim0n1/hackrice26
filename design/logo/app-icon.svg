<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- NutriQuest app icon. Green bg, white mark. Scan corners pulled in for safe area. -->
  <rect width="1024" height="1024" rx="224" fill="#5FCB82"/>

  <g transform="translate(212,212) scale(6.4)">
    <!-- Scan frame (white) -->
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M22 38 L22 26 L34 26"/>
      <path d="M86 26 L98 26 L98 38"/>
      <path d="M22 82 L22 94 L34 94"/>
      <path d="M86 94 L98 94 L98 82"/>
    </g>

    <!-- Sparkle -->
    <path d="M92 18 C94 24 96 26 102 28 C96 30 94 32 92 38 C90 32 88 30 82 28 C88 26 90 24 92 18 Z" fill="#FFC24B"/>

    <!-- Sprout body (white) -->
    <path d="M60 38 C76 38 84 54 82 70 C80 88 72 100 60 100 C48 100 40 88 38 70 C36 54 44 38 60 38 Z" fill="#FFFFFF"/>

    <!-- Leaf (slightly darker — use ink for contrast on green bg) -->
    <path d="M60 40 C56 30 50 26 44 26 C46 32 50 38 56 42 Z" fill="#3FAE63"/>
    <path d="M60 40 C64 30 70 26 76 26 C74 32 70 38 64 42 Z" fill="#3FAE63"/>

    <!-- Eyes (ink on white body) -->
    <ellipse cx="50" cy="62" rx="6" ry="7.5" fill="#3A342E"/>
    <ellipse cx="70" cy="62" rx="6" ry="7.5" fill="#3A342E"/>
    <circle cx="51" cy="64" r="4" fill="white"/>
    <circle cx="71" cy="64" r="4" fill="white"/>
    <circle cx="49" cy="61" r="1.5" fill="#3A342E"/>
    <circle cx="69" cy="61" r="1.5" fill="#3A342E"/>

    <!-- Blush -->
    <ellipse cx="42" cy="72" rx="5" ry="3" fill="#FF9F9F" opacity="0.7"/>
    <ellipse cx="78" cy="72" rx="5" ry="3" fill="#FF9F9F" opacity="0.7"/>

    <!-- Smile -->
    <path d="M53 74 Q60 80 67 74" stroke="#3A342E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
